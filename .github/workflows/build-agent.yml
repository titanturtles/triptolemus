name: Build agent (Windows + Linux)

# Builds the pt_agent executables on real runners (PyInstaller can't cross-compile).
# Run from the Actions tab (Run workflow) or by pushing a tag like v1.1.1.
# Each platform's binary is uploaded as a downloadable artifact. Optionally, when you tick
# "publish" AND the repo has the SCOREBOARD_ADMIN_TOKEN secret, each job publishes straight
# to the scoreboard's App-update endpoint so students auto-update.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish to the scoreboard (needs the SCOREBOARD_ADMIN_TOKEN secret)"
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: python -m pip install --upgrade pyinstaller cryptography
      - name: Read AGENT_VERSION
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pt_agent.py -Pattern 'AGENT_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $v) { Write-Error "AGENT_VERSION not found in pt_agent.py"; exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building pt_agent.exe version $v"
      - name: Build pt_agent.exe
        run: python -m PyInstaller --onefile --windowed --name pt_agent --noconfirm pt_agent.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pt_agent-windows-v${{ steps.ver.outputs.version }}
          path: dist/pt_agent.exe
          if-no-files-found: error
      - name: Publish to scoreboard (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: pwsh
        env:
          ADMIN_TOKEN: ${{ secrets.SCOREBOARD_ADMIN_TOKEN }}
        run: |
          if (-not $env:ADMIN_TOKEN) { Write-Error "Set the SCOREBOARD_ADMIN_TOKEN repo secret to publish."; exit 1 }
          curl.exe -sS -f -H "X-Admin-Token: $env:ADMIN_TOKEN" `
            -F platform=windows -F version=${{ steps.ver.outputs.version }} `
            -F binary=@dist/pt_agent.exe `
            https://scoreboard.titanturtles.xyz/levels/admin/agentpublish
          Write-Host "`nPublished windows ${{ steps.ver.outputs.version }}"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python + Tk + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          pip install --upgrade pip pyinstaller cryptography
      - name: Read AGENT_VERSION
        id: ver
        run: |
          v=$(sed -n 's/^AGENT_VERSION *= *"\([^"]*\)".*/\1/p' pt_agent.py)
          [ -n "$v" ] || { echo "AGENT_VERSION not found"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building pt_agent version $v"
      - name: Build pt_agent
        run: |
          . .venv/bin/activate
          pyinstaller --onefile --windowed --name pt_agent --noconfirm pt_agent.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pt_agent-linux-v${{ steps.ver.outputs.version }}
          path: dist/pt_agent
          if-no-files-found: error
      - name: Publish to scoreboard (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          ADMIN_TOKEN: ${{ secrets.SCOREBOARD_ADMIN_TOKEN }}
        run: |
          [ -n "$ADMIN_TOKEN" ] || { echo "Set the SCOREBOARD_ADMIN_TOKEN repo secret to publish."; exit 1; }
          curl -sS -f -H "X-Admin-Token: $ADMIN_TOKEN" \
            -F platform=linux -F version=${{ steps.ver.outputs.version }} \
            -F binary=@dist/pt_agent \
            https://scoreboard.titanturtles.xyz/levels/admin/agentpublish
          echo "Published linux ${{ steps.ver.outputs.version }}"
